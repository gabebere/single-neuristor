name: Verify library
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      MPLBACKEND: Agg
    steps:
      # Official action documentation: github.com/actions/{checkout,setup-python}.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: neuristor validate
      - run: neuristor validate --publication
      - run: neuristor study plan --config experiments/studies/sample_parameter_map.toml
