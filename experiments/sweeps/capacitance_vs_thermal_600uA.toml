schema_version = 1
name = "Electrical versus thermal capacitance at 600 uA"
kind = "sweep"
model = "current"

[sweep]
base_config = "../current/sweep_base.toml"
max_points = 100

[[sweep.axes]]
path = "electrical.C_pF"
values = [0.0, 5.0, 10.0, 25.0, 50.0, 100.0, 200.0]

[[sweep.axes]]
path = "thermal.C_th_pJ_per_K"
values = [2.5, 5.0, 10.0, 25.0, 49.62776831, 75.0, 100.0]

[output]
root = "runs"
