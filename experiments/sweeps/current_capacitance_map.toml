schema_version = 1
name = "Current-faceted electrical and thermal capacitance map"
kind = "sweep"
model = "current"

[sweep]
base_config = "../current/sweep_base.toml"
max_points = 500

[[sweep.axes]]
path = "input.amplitude_uA"
values = [300.0, 400.0, 500.0, 600.0, 700.0, 800.0]

[[sweep.axes]]
path = "electrical.C_pF"
values = [0.0, 10.0, 25.0, 50.0, 145.34619293]

[[sweep.axes]]
path = "thermal.C_th_pJ_per_K"
values = [5.0, 10.0, 25.0, 49.62776831, 100.0]

[output]
root = "runs"
