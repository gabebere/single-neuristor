schema_version = 1
name = "Specimen model prediction versus measured current sweep"
kind = "simulation"
model = "current"
seed = 0

# The standard current-recipe fields hold the single frozen parameter set.
[time]
dt_ns = 0.05
pre_us = 0.2
duration_us = 0.5

[input]
amplitude_uA = 228.152299
on_us = 0.0
off_us = 0.3

[initial]
voltage_V = 0.0
temperature_K = 314.4

[electrical]
# Conservative experimental timing upper bound; the constrained best fit is zero.
C_pF = 0.39

[thermal]
C_th_pJ_per_K = 0.0478732360
S_e_mW_per_K = 0.0036751265
T0_K = 314.4

[resistance]
preset = "../../presets/resistance_100425_chip1_gap3.json"
start_branch = "insulator"

[analysis]
start_us = 0.05
stop_us = 0.25

[lab_validation]
data_directory = "../../data/experimental/tia_current_sweep"
convergence_dt_ns = 0.025
convergence_drives_mV = [300.0, 500.0, 800.0]

[sensitivity]
# The first three values span the admissible timing range. Larger values are an
# explicitly out-of-bound stress test showing what the present model would need.
electrical_capacitances_pF = [0.0, 0.1, 0.2, 0.39, 1.0, 2.0, 3.0, 5.0, 7.0, 10.0, 20.0, 50.0]
thermal_capacitances_pJ_per_K = [0.021918, 0.035, 0.0478732360, 0.070, 0.092624]
pulse_duration_ns = 300.0
pre_duration_ns = 200.0
post_duration_ns = 200.0

[output]
root = "runs"
