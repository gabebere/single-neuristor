# Descriptive evidence IDs, not final figure numbering. Paths are repository-relative.
schema_version = 1
status = "supporting evidence; quantitative TIA calibration unresolved"

[[evidence]]
id = "yuanhang_voltage_control"
claim_scope = "Mechanism/control simulation, with the recipe's Cth choice explicitly retained."
recipe = "experiments/voltage/yuanhang_oscillator.toml"
inputs = []
command = "neuristor simulate voltage --config experiments/voltage/yuanhang_oscillator.toml"
outputs = ["traces.csv", "metrics.json", "report.md", "figures/overview.png"]

[[evidence]]
id = "ideal_current_valley"
claim_scope = "Nonzero metallic valley control; not the TIA sample calibration."
recipe = "experiments/current/nonzero_voltage_valley.toml"
inputs = []
command = "neuristor simulate current --config experiments/current/nonzero_voltage_valley.toml"
outputs = ["traces.csv", "metrics.json", "report.md", "figures/overview.png"]
reference = "public_jobs/20260817_100102_current-step-with-a-nonzero-metallic-voltage-val_6765e0"

[[evidence]]
id = "sample_static_resistance"
claim_scope = "Static major-loop fitting only; gamma and dynamic constants not identified."
inputs = ["data/experimental/100425_chip1_gap3.tsv"]
command = "neuristor fit resistance --data data/experimental/100425_chip1_gap3.tsv --method major-loop --bootstrap-samples 0 --seed 42"
outputs = ["measured.csv", "parameter_summary.csv", "resistance_preset.json", "metrics.json", "figures/resistance_fit.png"]

[[evidence]]
id = "sample_map_demonstration"
claim_scope = "Small complete software demonstration; 110 MHz is an operating filter, not a universal physical limit."
recipe = "experiments/studies/sample_parameter_map.toml"
inputs = ["data/experimental/100425_chip1_gap3.tsv"]
command = "neuristor study run --config experiments/studies/sample_parameter_map.toml"
outputs = ["parameter_maps.html", "stages.json", "metrics.json", "report.md"]
stage_outputs = {fit = ["parameter_summary.csv", "figures/resistance_fit.png"], grid = ["grid.csv", "verification.csv"], media = ["gif_catalog.json", "animation_checks.csv"]}
reference = "public_jobs/20261007_083908_sample-r-t-to-screened-map-and-embedded-gifs_ec2d1e"

[[evidence]]
id = "frozen_lab_comparison"
claim_scope = "Historical forward-comparison and sensitivity protocol; disagreement is evidence, not a successful fit."
recipe = "experiments/current/specimen_model_validation.toml"
inputs = ["data/experimental/tia_current_sweep", "presets/resistance_100425_chip1_gap3.json"]
command = "neuristor analyze model-validation --config experiments/current/specimen_model_validation.toml"
outputs = ["metrics.json", "report.md"]
